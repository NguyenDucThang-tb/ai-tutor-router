services:
  tutor-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TUTOR_ENVIRONMENT: development
      TUTOR_PROVIDER: mock
      TUTOR_AUTH_ENABLED: "false"
      TUTOR_ROUTER_STRATEGY: rule
      TUTOR_SMALL_MODEL_IDENTIFIER: mock-small
      TUTOR_STRONG_MODEL_IDENTIFIER: mock-strong
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
