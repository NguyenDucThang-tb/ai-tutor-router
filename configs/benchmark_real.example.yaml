# Copy and review explicitly before any provider run. No secret belongs here.
mode: real
provider: litellm
small_model_identifier: REPLACE_WITH_VERIFIED_SMALL_MODEL
strong_model_identifier: REPLACE_WITH_VERIFIED_STRONG_MODEL
max_samples: 1
max_requests: 2
concurrency: 1
timeout_seconds: 30
temperature: 0
max_tokens: 256
seed: 42
max_retries: 0
execution_lease_seconds: 900
fallback_policy: disabled
allow_real_provider: false
experiment_approval_id: REVIEWED_APPROVAL_REFERENCE
allow_paid_retries: false
# Required with allow_paid_retries=true or max_retries>0.
# paid_retry_approval_id: REVIEWED_RETRY_APPROVAL_REFERENCE
allow_uncertain_reissue: false
# Required only after explicit approval to reissue an uncertain provider outcome.
# uncertain_reissue_approval_id: REVIEWED_UNCERTAIN_REISSUE_APPROVAL
